[project]
name = "opentape"
version = "0.1.0"
description = "A standard format and replay engine for prediction-market data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andre Ruiz Loera", email = "andre.x.ruizloera@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "pyarrow>=16.0",
    "duckdb>=1.0",
]
keywords = ["prediction-markets", "market-data", "parquet", "duckdb", "replay"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Homepage = "https://github.com/andreruizloera/opentape"
Issues = "https://github.com/andreruizloera/opentape/issues"

[project.scripts]
opentape = "opentape.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
