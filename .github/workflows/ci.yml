name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Format check
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Demo commands
        run: |
          uv run opentape inspect examples/sample.parquet
          uv run opentape replay examples/sample.parquet --limit 5
          uv run opentape convert examples/fixtures/kalshi_style.json --format kalshi-style -o /tmp/k.parquet
          uv run opentape inspect /tmp/k.parquet
          uv run opentape book examples/sample.parquet --market OT-FEDCUT-SEP26 --depth 3
          uv run opentape capture --help
          uv run opentape markets --help
          # A websocket capture of Kalshi must fail cleanly, naming the
          # reason, rather than opening a socket to find out.
          if uv run opentape capture --venue kalshi --transport websocket \
                 --market X -o /tmp/no.parquet > /tmp/refusal.txt 2>&1; then
            echo "expected a nonzero exit for a kalshi websocket capture" >&2
            exit 1
          fi
          grep -q 'requires an API key' /tmp/refusal.txt
          grep -q 'transport rest-poll' /tmp/refusal.txt
          # Contradictory lifecycle flags are refused before any work.
          if uv run opentape capture --venue polymarket --market X -o /tmp/no.parquet \
                 --status-every 10s --no-status-check > /tmp/contradiction.txt 2>&1; then
            echo "expected a nonzero exit for --status-every with --no-status-check" >&2
            exit 1
          fi
          grep -q 'contradict each other' /tmp/contradiction.txt
          # --stop-when-settled must reach BOTH transports. It is the
          # third flag to apply to both, and the polling-only refusal
          # list is where the previous two nearly landed by accident.
          uv run opentape capture --help | grep -q -- '--stop-when-settled'

      - name: Offline demo
        run: |
          ./demo.sh > /tmp/demo.txt 2>&1 || { cat /tmp/demo.txt; exit 1; }
          # The close-mid-capture lines the README pastes. They are the
          # whole point of that demo part, so drift should fail here
          # rather than be discovered by a reader.
          grep -q 'DEMO-CLOSE changed status: open -> closed' /tmp/demo.txt
          grep -q 'status changes observed: 1' /tmp/demo.txt
          grep -q 'seq=1  15:20:00  status=open' /tmp/demo.txt
          grep -q 'seq=7  15:20:04  status=closed' /tmp/demo.txt
          # The settlement half of the same demo part. The close and the
          # resolution are separate rows at separate times on purpose,
          # so both timestamps are checked and not just the outcome.
          grep -q 'DEMO-CLOSE resolved: YES settles at 1' /tmp/demo.txt
          grep -q 'settlements observed:    1' /tmp/demo.txt
          grep -q 'seq=10  15:20:06  resolution=YES settles at 1' /tmp/demo.txt
          # The two runs of the same scripted venue that the README
          # pastes for --stop-when-settled. The claim is that the flag
          # and nothing else accounts for the difference, so BOTH lines
          # are checked: a drift that changed the baseline would
          # otherwise leave the interesting line looking correct.
          grep -q 'default: 60 polls, 150 venue requests,   60s of the 60s asked for, stopped_early=False' /tmp/demo.txt
          grep -q -- '--stop-when-settled:  7 polls,  18 venue requests,    6s of the 60s asked for, stopped_early=True' /tmp/demo.txt
